# App Android do Pons: compila, roda os testes e, quando a versão em android/version.properties muda,
# publica o APK assinado como Release "android-vX.Y.Z" e atualiza o link fixo (Release "android").
name: App Android

on:
  push:
    branches: [main]
    paths: ["android/**", ".github/workflows/android.yml"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android
  cancel-in-progress: false

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Versão
        id: versao
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          V=$(grep '^versionName=' android/version.properties | cut -d= -f2)
          echo "VERSAO=$V" >> $GITHUB_ENV
          if gh release view "android-v$V" >/dev/null 2>&1; then echo "publicar=nao" >> $GITHUB_OUTPUT; else echo "publicar=sim" >> $GITHUB_OUTPUT; fi

      - name: Compilar e testar
        working-directory: android
        env:
          KS_B64: ${{ secrets.PONS_KEYSTORE_B64 }}
          PONS_KEYSTORE_PASS: ${{ secrets.PONS_KEYSTORE_PASS }}
        run: |
          if [ -n "$KS_B64" ]; then echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/pons.jks"; export PONS_KEYSTORE="$RUNNER_TEMP/pons.jks"; fi
          chmod +x gradlew
          ./gradlew testDebugUnitTest assembleRelease --console=plain

      - name: Conferir assinatura para publicar
        if: steps.versao.outputs.publicar == 'sim'
        env:
          KS_B64: ${{ secrets.PONS_KEYSTORE_B64 }}
        run: |
          if [ -z "$KS_B64" ]; then
            echo "::error::Cadastre os segredos PONS_KEYSTORE_B64 e PONS_KEYSTORE_PASS no GitHub para publicar o APK."
            exit 1
          fi
          cp android/app/build/outputs/apk/release/app-release.apk "Pons-$VERSAO.apk"

      - name: Publicar
        if: steps.versao.outputs.publicar == 'sim'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          awk -v v="## $VERSAO" '$0==v{f=1;next} /^## /{f=0} f' android/CHANGELOG.md > notas.md
          gh release create "android-v$VERSAO" "Pons-$VERSAO.apk" --title "Pons para Android $VERSAO" \
            --notes-file notas.md --latest=false
          # link fixo + aviso de versão nova lido pelo app
          cp "Pons-$VERSAO.apk" Pons.apk
          printf '{"versao":"%s","codigo":%s,"url":"https://github.com/%s/releases/download/android/Pons.apk"}\n' \
            "$VERSAO" "$(grep '^versionCode=' android/version.properties | cut -d= -f2)" "${{ github.repository }}" > versao.json
          gh release view android >/dev/null 2>&1 || gh release create android --title "Pons para Android — última versão" \
            --notes "Link fixo do APK mais recente: https://github.com/${{ github.repository }}/releases/download/android/Pons.apk" --latest=false
          gh release upload android Pons.apk versao.json --clobber
